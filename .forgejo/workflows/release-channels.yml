# Generated by dave-fork-ci/ci/install-channel-automation.py
name: Verified release channels
'on':
  push:
    branches:
    - main
  pull_request: {}
  schedule:
  - cron: 43 3 * * *
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options:
        - tested
        - stable
        default: tested
      revision:
        type: string
        description: Exact tested commit for stable; empty uses the event commit
        required: false
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verified-release-pr-{0}', github.ref) || 'verified-release-channels' }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: nix
    timeout-minutes: 360
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = false
        sandbox = false
        filter-syscalls = false
    container:
      image: nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
    outputs:
      revision: ${{ steps.selection.outputs.revision }}
    steps:
    - name: Checkout exact source without a Node dependency
      env:
        TOKEN: ${{ github.token }}
        SERVER: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        set -eu
        auth=$(printf "x-access-token:%s" "$TOKEN" | base64 | tr -d "\n")
        git init -q .
        git remote add origin "$SERVER/$REPO.git"
        git -c http.extraHeader="Authorization: Basic $auth" fetch -q origin "$SHA"
        git checkout -q --detach FETCH_HEAD
    - name: Regression tests and complete inventory policy
      run: |-
        nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c python3 ci/test-release-channel.py
        nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c python3 ci/test-update-automation.py
        nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c python3 ci/release-channel.py policy
    - name: Select immutable revision
      id: selection
      env:
        REVISION: ${{ inputs.revision || github.sha }}
        CHANNEL: ${{ inputs.channel || 'tested' }}
      run: nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c
        python3 -c 'import os,re; s=os.environ["REVISION"]; assert re.fullmatch("[a-f0-9]{40}",s); open(os.environ["GITHUB_OUTPUT"],"a").write("revision="+s+"\n")'
  build_x86_64_linux:
    runs-on: nix
    timeout-minutes: 360
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = false
        sandbox = false
        filter-syscalls = false
    container:
      image: nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
    needs:
    - test
    outputs:
      proof: ${{ steps.release.outputs.proof }}
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'schedule' && github.ref == 'main')) }}
    steps:
    - name: Checkout exact source without a Node dependency
      env:
        TOKEN: ${{ github.token }}
        SERVER: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        SHA: ${{ needs.test.outputs.revision }}
      run: |
        set -eu
        auth=$(printf "x-access-token:%s" "$TOKEN" | base64 | tr -d "\n")
        git init -q .
        git remote add origin "$SERVER/$REPO.git"
        git -c http.extraHeader="Authorization: Basic $auth" fetch -q origin "$SHA"
        git checkout -q --detach FETCH_HEAD
    - name: Configure job-local private cache reader
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || secrets.FLAKEY_ATTIC_TOKEN }}
      run: nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c
        python3 ci/configure-attic-read.py
    - name: Build complete native inventory, upload, verify remote NAR bytes
      id: release
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || secrets.FLAKEY_ATTIC_TOKEN }}
      run: nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c
        python3 ci/release-channel.py build --system x86_64-linux
    - name: Remove cache reader
      if: ${{ always() }}
      run: nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c
        python3 ci/configure-attic-read.py --cleanup
  retain_x86_64_linux:
    runs-on: nix
    timeout-minutes: 360
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = false
        sandbox = false
        filter-syscalls = false
    container:
      image: nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || (github.event_name == 'schedule' && github.ref == 'main'))
      }}
    steps:
    - name: Checkout exact source without a Node dependency
      env:
        TOKEN: ${{ github.token }}
        SERVER: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        set -eu
        auth=$(printf "x-access-token:%s" "$TOKEN" | base64 | tr -d "\n")
        git init -q .
        git remote add origin "$SERVER/$REPO.git"
        git -c http.extraHeader="Authorization: Basic $auth" fetch -q origin "$SHA"
        git checkout -q --detach FETCH_HEAD
    - name: Configure job-local private reader
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || secrets.FLAKEY_ATTIC_TOKEN }}
      run: nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c
        python3 ci/configure-attic-read.py
    - name: Verify advertised/recent releases independently of current builds
      env:
        SOURCE_TOKEN: ${{ github.token }}
      run: nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c
        python3 ci/release-channel.py retain --system x86_64-linux
    - name: Remove private reader
      if: ${{ always() }}
      run: nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c
        python3 ci/configure-attic-read.py --cleanup
  promote:
    runs-on: nix
    timeout-minutes: 360
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = false
        sandbox = false
        filter-syscalls = false
    container:
      image: nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
    needs:
    - test
    - build_x86_64_linux
    permissions:
      contents: write
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'schedule' && github.ref == 'main')) }}
    steps:
    - name: Checkout exact source without a Node dependency
      env:
        TOKEN: ${{ github.token }}
        SERVER: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        SHA: ${{ needs.test.outputs.revision }}
      run: |
        set -eu
        auth=$(printf "x-access-token:%s" "$TOKEN" | base64 | tr -d "\n")
        git init -q .
        git remote add origin "$SERVER/$REPO.git"
        git -c http.extraHeader="Authorization: Basic $auth" fetch -q origin "$SHA"
        git checkout -q --detach FETCH_HEAD
    - name: Atomically publish immutable release tag and channel
      env:
        CHANNEL_TOKEN: ${{ secrets.CHANNEL_TOKEN || github.token }}
        RELEASE_PROOFS: '{"x86_64-linux": "${{ needs.build_x86_64_linux.outputs.proof }}"}'
        REVISION: ${{ needs.test.outputs.revision }}
        CHANNEL: ${{ inputs.channel || 'tested' }}
      run: nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c
        python3 ci/release-channel.py promote --channel "$CHANNEL" --revision "$REVISION" --proofs "$RELEASE_PROOFS"
