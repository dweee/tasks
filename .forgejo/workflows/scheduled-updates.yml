name: Input and manual version monitoring
'on':
  schedule:
  - cron: 37 */6 * * *
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: scheduled-input-updates
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: nix-light
    timeout-minutes: 120
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = false
        sandbox = false
        filter-syscalls = false
    container:
      image: nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
    if: ${{ (github.ref == 'refs/heads/main' || (github.event_name == 'schedule' && github.ref == 'main')) }}
    steps:
    - name: Checkout exact source without a Node dependency
      env:
        TOKEN: ${{ github.token }}
        SERVER: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        set -eu
        auth=$(printf "x-access-token:%s" "$TOKEN" | base64 | tr -d "\n")
        git init -q .
        git remote add origin "$SERVER/$REPO.git"
        git -c http.extraHeader="Authorization: Basic $auth" fetch -q origin "$SHA"
        git checkout -q --detach FETCH_HEAD
    - name: Monitor manual package/file pins
      id: monitor
      env:
        GH_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        MONITOR_TOKEN: ${{ github.token }}
      run: nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c
        python3 ci/update-monitor.py
    - name: Maintain one version monitoring issue
      if: ${{ always() }}
      env:
        AUTOMATION_TOKEN: ${{ secrets.UPDATE_TOKEN || github.token }}
      run: nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c
        python3 ci/automation-forge.py report
  inputs:
    runs-on: nix-light
    timeout-minutes: 120
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = false
        sandbox = false
        filter-syscalls = false
    container:
      image: nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
    if: ${{ (github.ref == 'refs/heads/main' || (github.event_name == 'schedule' && github.ref == 'main')) }}
    steps:
    - name: Checkout exact source without a Node dependency
      env:
        TOKEN: ${{ github.token }}
        SERVER: ${{ github.server_url }}
